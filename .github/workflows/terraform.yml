
name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Required for Azure OIDC
permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================
  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Azure Login using OIDC
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # 3. Verify Azure Login
      # --------------------------------------------------------
      - name: Check Azure Login
        run: |
          az account show


      # --------------------------------------------------------
      # 4. Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # --------------------------------------------------------
      # 5. Check Terraform Configuration
      # --------------------------------------------------------
      - name: Check Terraform Configuration
        working-directory: ./root
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform files:"
          ls -la

          echo ""
          echo "Terraform version:"
          terraform version


      # --------------------------------------------------------
      # 6. Terraform Format Check
      # --------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ./root
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # 7. Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ./root
        run: terraform init


      # --------------------------------------------------------
      # 8. Terraform Validate
      # --------------------------------------------------------
      - name: Terraform Validate
        working-directory: ./root
        run: terraform validate


      # --------------------------------------------------------
      # 9. Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: ./root
        run: terraform plan -no-color -out=tfplan


      # --------------------------------------------------------
      # 10. Upload Terraform Plan
      # --------------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: root/tfplan


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================
  terraform-apply:

    name: Terraform Apply

    needs: terraform-plan

    # Apply ONLY after merge/push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # GitHub Environment
    # Configure required reviewers in:
    # Settings → Environments → production
    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Azure Login using OIDC
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # 3. Verify Azure Login
      # --------------------------------------------------------
      - name: Check Azure Login
        run: |
          az account show


      # --------------------------------------------------------
      # 4. Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # --------------------------------------------------------
      # 5. Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ./root
        run: terraform init


      # --------------------------------------------------------
      # 6. Download Terraform Plan
      # --------------------------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: root


      # --------------------------------------------------------
      # 7. Verify Plan File
      # --------------------------------------------------------
      - name: Verify Terraform Plan
        working-directory: ./root
        run: |
          echo "Files in root:"
          ls -la

          echo ""
          echo "Terraform plan:"
          ls -lh tfplan


      # --------------------------------------------------------
      # 8. Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: ./root
        run: terraform apply -auto-approve tfplan
