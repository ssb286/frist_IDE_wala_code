name: Terraform Azure CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: true
  TF_VERSION: "1.9.8"

jobs:

  # ============================================================
  # STAGE 1 - SECURITY SCAN
  # ============================================================
  security_scan:

    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------
      # Terraform Format Check
      # -------------------------------
      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      # -------------------------------
      # TFLint
      # -------------------------------
      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Scan
        run: tflint --recursive

      # -------------------------------
      # Gitleaks
      # -------------------------------
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2

      # -------------------------------
      # Trivy IaC Scan
      # -------------------------------
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL


  # ============================================================
  # STAGE 2 - TERRAFORM PLAN
  # ============================================================
  terraform_plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    needs:
      - security_scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Terraform
      # -------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------------
      # Azure Login using OIDC
      # -------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -------------------------------
      # Terraform Init
      # -------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------
      # Terraform Validate
      # -------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -------------------------------
      # Terraform Plan
      # -------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # -------------------------------
      # Upload Plan
      # -------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan


  # ============================================================
  # STAGE 3 - APPLY
  # ============================================================
  terraform_apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply only after plan
    needs:
      - terraform_plan

    # Only main branch
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------
      # Setup Terraform
      # -------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------------
      # Azure Login
      # -------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -------------------------------
      # Terraform Init
      # -------------------------------
      - name: Terraform Init
        run: terraform init

      # -------------------------------
      # Download Plan
      # -------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      # -------------------------------
      # Terraform Apply
      # -------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
