name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

# Minimum GitHub permissions required for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Security & Deployment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./root

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Secret Scan
      # ============================================================
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3


      # ============================================================
      # 3. Setup Terraform
      # ============================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ============================================================
      # 4. Check Terraform Files
      # ============================================================
      - name: Check Terraform Files
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Terraform files:"
          find . -name "*.tf" -type f


      # ============================================================
      # 5. Terraform Format
      # ============================================================
      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # ============================================================
      # 6. Checkov Security Scan
      # ============================================================
      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./root
          framework: terraform
          quiet: false
          soft_fail: true


      # ============================================================
      # 7. Trivy IaC Security Scan
      # ============================================================
      - name: Trivy Terraform Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./root
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true


      # ============================================================
      # 8. Azure Login using GitHub OIDC
      # ============================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================================
      # 9. Verify Azure Login
      # ============================================================
      - name: Check Azure Login
        run: |
          az account show


      # ============================================================
      # 10. Configure Terraform Azure OIDC
      # ============================================================
      - name: Configure Terraform Azure OIDC
        run: |
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"


      # ============================================================
      # 11. Terraform Init
      # ============================================================
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="use_oidc=true"


      # ============================================================
      # 12. Terraform Validate
      # ============================================================
      - name: Terraform Validate
        run: terraform validate


      # ============================================================
      # 13. Terraform Plan
      # ============================================================
      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan


      # ============================================================
      # 14. Terraform Apply
      # Only runs after push to main
      # PRs will NEVER run apply
      # ============================================================
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
